[package]
name = "bench"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
pad64 = []

[dependencies]
rayon = "1.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
