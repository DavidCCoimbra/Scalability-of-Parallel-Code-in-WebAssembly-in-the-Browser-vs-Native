# AI review with the Claude Code GitHub Action, using the author's Claude
# subscription token (no API billing). It reviews and comments; it never
# pushes commits.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  auto-review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. First read and apply
            .claude/agents/methodology-reviewer.md (study checklist and
            general rules). Post each finding as an inline comment on the
            line it concerns, then one summary comment on the PR with the
            findings ranked by severity. If there are no findings, say so
            in the summary. Never push commits. Never use the em dash.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  mention:
    # Only the author can summon a review, so the bot never triggers itself.
    # Comments that local Claude posts through the author's account start
    # with "[claude]" and are skipped too.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request ||
       github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      !startsWith(github.event.comment.body, '[claude]') &&
      github.event.comment.user.login == 'DavidCCoimbra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
