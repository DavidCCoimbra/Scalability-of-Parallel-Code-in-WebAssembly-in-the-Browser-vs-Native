name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      browser: ${{ steps.filter.outputs.browser }}
      paper: ${{ steps.filter.outputs.paper }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'bench/**'
            browser:
              - 'bench/**'
              - 'harness/**'
            paper:
              - 'paper/**'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      # rustup installs the pinned nightly from bench/rust-toolchain.toml.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo clippy --release --all-targets --features pad64 -- -D warnings
      - run: cargo clippy --release --lib --target wasm32-unknown-unknown -Z build-std=panic_abort,std -- -D warnings
      - run: cargo test --release
      - run: cargo test --release --features pad64
      - run: cargo build-wasm
      - name: SIMD check, final wasm32 module (simd128)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wabt
          wasm-objdump -d target/wasm32-unknown-unknown/release/bench.wasm > bench.wasm.dis
          python3 ../scripts/check_simd.py bench.wasm.dis wasm32
      - run: cargo build-wasm --features pad64
      - id: wasm-bindgen
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Browser package from a clean checkout
        run: |
          ./build-wasm.sh
          test -f www/pkg/bench.js
          test -f www/pkg/bench_bg.wasm
      - name: SIMD check, native x86-64 binary (SSE2)
        run: |
          cargo build --release --bin native
          objdump -d -C --no-show-raw-insn target/release/native > native.dis
          python3 ../scripts/check_simd.py native.dis x86_64

  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
      - id: wasm-bindgen
        working-directory: bench
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Native runner and browser package
        working-directory: bench
        run: |
          cargo build --release --bin native
          ./build-wasm.sh
      - uses: actions/cache@v4
        with:
          path: harness/browsers
          key: browsers-${{ hashFiles('harness/browsers.json') }}
      - name: Checksums in Chrome and Firefox equal native
        run: python3 -m harness.browser_check --chrome-flag=--no-sandbox

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -t .
      - run: python3 -m unittest discover -s harness/tests -t .
      - run: python3 -m unittest discover -s analysis/tests -t .
      - run: pipx run uv run --no-project --with mypy --with matplotlib mypy --strict harness analysis scripts
      - run: shellcheck bench/build-wasm.sh harness/env/*.sh scripts/*.sh

  paper:
    needs: changes
    if: needs.changes.outputs.paper == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          # One folder per document (final, pilot, proposal); each builds from its own folder,
          # with ../figures and ../bib shared.
          root_file: "paper/*/*.tex"
          work_in_root_file_dir: true
      # The paper's limit is 5 pages of content plus 2 of references; CI checks the total.
      - name: Page limit
        run: |
          pages=$(grep -o 'Output written on paper.pdf ([0-9]* pages' paper/final/paper.log | grep -o '[0-9]*' | tail -1)
          echo "paper.pdf: $pages pages"
          [ -n "$pages" ] && [ "$pages" -le 7 ]
      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdfs
          path: |
            paper/final/*.pdf
            paper/pilot/*.pdf
            paper/proposal/*.pdf
